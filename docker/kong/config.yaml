_format_version: "3.0"
_transform: true

services: 
  - name: verses-service
    url: http://host.docker.internal:3333
    connect_timeout: 10000
    retries: 3
    routes:
      - name: public-api
        protocols:
          - http
          - https
        paths:
          - /health
          - /verse
          # CORREÇÃO 1: Removido "/.*". "/auth" já pega tudo que começa com /auth
          - /auth 
        # CORREÇÃO 2: Mudei para false. Se o Fastify espera "/verse", o Kong não pode remover isso.
        strip_path: false
        plugins:
          - name: cors
            config:
              # CORREÇÃO 3: Origins agora é uma lista (array)
              origins: 
                - "*"
              methods:
                - GET
                - POST
                - PUT
                - DELETE
              headers: 
                - Accept
                - Content-Type
                - Authorization
              credentials: true
              exposed_headers:
                - Authorization
                - Set-Cookie
                - X-Token-Expiry
              max_age: 3600

      - name: protected-api
        protocols:
          - http
          - https
        paths:
          - /admin
          - /profile
        strip_path: false # CORREÇÃO: false para manter o caminho original
        plugins:
          - name: jwt
            config:
              secret_is_base64: false
              cookie_names:
                - access_token
              run_on_preflight: true
              claims_to_verify:
                - exp
                - nbf
              maximum_expiration: 3600
              header_names:
                - authorization

          - name: cors
            config:
              # CORREÇÃO: Origins agora é uma lista
              origins: 
                - "*"
              methods:
                - GET
                - POST
                - PUT
                - DELETE
                - PATCH
                - OPTIONS
              headers: 
                - Accept
                - Content-Type
                - Authorization
                - X-Requested-With
              credentials: true
              exposed_headers:
                - Authorization
                - X-Token-Expiry
                - X-RateLimit-Limit
                - X-RateLimit-Remaining
              max_age: 3600

# (Opcional) Removi o segundo serviço 'auth-consumers' pois era redundante, 
# já que aponta para a mesma URL e a rota de /auth já foi incluída acima.

