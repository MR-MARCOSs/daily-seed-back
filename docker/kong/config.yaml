_format_version: "3.0"
_transform: true

services: 
  - name: verses-service
    url: http://verses-backend:3333
    connect_timeout: 10000
    retries: 3
    routes:
      - name: public-api
        protocols:
          - http
          - https
        paths:
          - /health
          - /verse
          - /bible/range
          - /auth 
        strip_path: false
        plugins:
          - name: cors
            config:
              origins: 
                - https://daily-seed-gilt.vercel.app
              methods:
                - GET
                - POST
                - PUT
                - DELETE
              headers: 
                - Accept
                - Content-Type
                - Authorization
              credentials: true
              exposed_headers:
                - Authorization
                - Set-Cookie
                - X-Token-Expiry
              max_age: 3600

      - name: protected-api
        protocols:
          - http
          - https
        paths:
          - /admin
          - /profile
        strip_path: false 
        plugins:
          - name: jwt
            config:
              secret_is_base64: false
              cookie_names:
                - access_token
              run_on_preflight: true
              claims_to_verify:
                - exp
              maximum_expiration: 3600
              header_names:
                - authorization

          - name: cors
            config:
              origins: 
                - https://daily-seed-gilt.vercel.app
              methods:
                - GET
                - POST
                - PUT
                - DELETE
                - PATCH
                - OPTIONS
              headers: 
                - Accept
                - Content-Type
                - Authorization
                - X-Requested-With
              credentials: true
              exposed_headers:
                - Authorization
                - X-Token-Expiry
                - X-RateLimit-Limit
                - X-RateLimit-Remaining
              max_age: 3600

