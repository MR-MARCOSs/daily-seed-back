_format_version: "3.0"
_transform: true

services: 
  - name: verses
    url: http://host.docker.internal:3333
    protocol: http
    host: host.docker.internal
    port: 3333
    path: /
    connect_timeout: 10000
    retries: 3
    routes:
      - name: api
        protocols:
          - http
          - https
        paths:
          - /verses

plugins:
  - name: cors
    config:
      origins: "*"
      methods:
        - GET
        - POST
        - PUT
        - DELETE
      headers: 
        - Accept
        - Content-Type
        - Authorization

